<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="Joyal2003 profile art">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#31d0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#31d0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff4d9d"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>

  <g opacity="0.26" stroke="#9eeaf9" stroke-width="2">
    <path d="M50 120 H590 M50 220 H590 M50 320 H590 M50 420 H590 M50 520 H590"/>
    <path d="M120 50 V590 M220 50 V590 M320 50 V590 M420 50 V590 M520 50 V590"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="320" cy="220" r="170" fill="none" stroke="url(#strokeGrad)" stroke-width="10" opacity="0.9"/>
    <circle cx="320" cy="220" r="118" fill="none" stroke="#75f0ff" stroke-width="2" opacity="0.9"/>
  </g>

  <g transform="translate(48 0)">
    <text x="220" y="290" font-size="240" font-family="Segoe UI, Arial, sans-serif" font-weight="800" fill="#dffcff" letter-spacing="-12">J</text>
    <text x="228" y="284" font-size="240" font-family="Segoe UI, Arial, sans-serif" font-weight="800" fill="#00f5d4" letter-spacing="-12" opacity="0.75" transform="translate(-12,0)">J</text>
    <text x="214" y="292" font-size="240" font-family="Segoe UI, Arial, sans-serif" font-weight="800" fill="#ff4d9d" letter-spacing="-12" opacity="0.55" transform="translate(14,0)">J</text>
  </g>

  <g fill="#d8fffd" opacity="0.8" font-family="Consolas, monospace" font-size="22" font-weight="700">
    <text x="80" y="120">01</text>
    <text x="470" y="120">10</text>
    <text x="95" y="500">11</text>
    <text x="470" y="500">00</text>
    <text x="120" y="190">11</text>
    <text x="470" y="190">01</text>
    <text x="120" y="380">10</text>
    <text x="480" y="380">11</text>
  </g>

  <g opacity="0.6" fill="#7ef9ff">
    <rect x="72" y="100" width="18" height="18"/>
    <rect x="540" y="110" width="20" height="20"/>
    <rect x="500" y="450" width="24" height="24"/>
    <rect x="88" y="450" width="22" height="22"/>
  </g>

  <g opacity="0.18" filter="url(#noise)">
    <rect width="640" height="640" fill="#ffffff"/>
  </g>

  <g opacity="0.35">
    <path d="M0 410 L640 410" stroke="#8ef6ff" stroke-width="2"/>
    <path d="M0 430 L640 430" stroke="#8ef6ff" stroke-width="1.2"/>
    <path d="M0 450 L640 450" stroke="#8ef6ff" stroke-width="1.4"/>
  </g>
</svg>
